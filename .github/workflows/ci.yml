name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (tsc + vite + eslint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Не блокирующий сигнал по уязвимостям зависимостей (иначе аудит
      # не гоняется нигде — см. находку о mermaid/lodash-es)
      - name: npm audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  rust:
    name: Rust (clippy + tests, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # --all-targets, а не --lib: интеграционные тесты (tests/mcp_e2e.rs)
      # и bin-цели иначе не компилируются и не гоняются нигде в CI,
      # при том что README обещает «CI enforces all of them»
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # cargo test (без --lib) линкует тестовый бинарник и запускает
      # интеграционные цели: platform-specific #[link] (например,
      # незагейченный user32) ловится здесь, а не при релизе
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # Проверочная сборка приложения на всех трёх ОС: запускается вручную
  # (Actions → CI → Run workflow) и на PR. Релизы собираются отдельной
  # джобой ниже — эта существует, чтобы убедиться в зелёности
  # Linux/macOS ДО нарезки тега.
  build:
    name: Build smoke (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    # contents:write — джоба пушит failure-лог в ветку ci-logs
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - run: npm ci
      - name: Build Tauri app (no bundle upload)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          npm run tauri build 2>&1 | tee build.log
      - name: Push failure log to ci-logs branch
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 200000 build.log > "failure-${{ matrix.platform }}.log" || true
          git config user.email "ci@nocturn-lab.dev"
          git config user.name "nocturn-ci"
          git add -f "failure-${{ matrix.platform }}.log"
          git commit -m "ci: failure log — ${{ matrix.platform }} — run ${{ github.run_id }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-logs" --force

  # Релиз: один тег v* → три платформы в один GitHub Release.
  # tauri-action сам генерирует latest.json для авто-обновлятора
  # (createUpdaterArtifacts: true в tauri.conf.json) и мержит записи
  # всех платформ в один файл в релизе.
  release:
    name: Release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    # macOS-джоба без подписных сертификатов может падать на нотаризации —
    # не разваливаем релиз Windows/Linux из-за неё
    continue-on-error: ${{ matrix.platform == 'macos-latest' }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - run: npm ci
      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Релизы брендируются как «Beta vN.N.N»; prerelease/draft не ставим:
          # /releases/latest не включает их, а на него смотрит endpoint
          # авто-обновления (tauri.conf.json → plugins.updater)
          releaseName: Beta ${{ github.ref_name }}
          releaseBody: "Скачай установщик для своей платформы. Обновление из приложения — автоматически (Windows: NSIS/MSI, Linux: AppImage; .deb обновляется вручную)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
