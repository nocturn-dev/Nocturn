name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (tsc + vite + eslint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (clippy + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  # Проверочная сборка приложения на всех трёх ОС: запускается вручную
  # (Actions → CI → Run workflow) и на PR. Релизы собираются отдельной
  # джобой ниже — эта существует, чтобы убедиться в зелёности
  # Linux/macOS ДО нарезки тега.
  build:
    name: Build smoke (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build Tauri app (no bundle upload)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

  # Релиз: один тег v* → три платформы в один GitHub Release.
  # tauri-action сам генерирует latest.json для авто-обновлятора
  # (createUpdaterArtifacts: true в tauri.conf.json) и мержит записи
  # всех платформ в один файл в релизе.
  release:
    name: Release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    # macOS-джоба без подписных сертификатов может падать на нотаризации —
    # не разваливаем релиз Windows/Linux из-за неё
    continue-on-error: ${{ matrix.platform == 'macos-latest' }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Релизы брендируются как «Beta vN.N.N»; prerelease/draft не ставим:
          # /releases/latest не включает их, а на него смотрит endpoint
          # авто-обновления (tauri.conf.json → plugins.updater)
          releaseName: Beta ${{ github.ref_name }}
          releaseBody: "Скачай установщик для своей платформы. Обновление из приложения — автоматически (Windows: NSIS/MSI, Linux: AppImage; .deb обновляется вручную)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
