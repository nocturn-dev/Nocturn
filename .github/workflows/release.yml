# Релизный пайплайн: один тег v* → три платформы в один GitHub Release.
# tauri-action сам генерирует latest.json для авто-обновлятора
# (createUpdaterArtifacts: true в tauri.conf.json) и мержит записи всех
# платформ в один файл в релизе. Без TAURI_SIGNING_PRIVATE_KEY сборка падает
# намеренно: неподписанные артефакты апдейтера нельзя выпускать.
#
# macOS: сборки неподписанные — dmg в релизе есть, но апдейтер на macOS не
# сработает (Gatekeeper не пропустит ad-hoc подпись, см. RELEASE.md); джоба
# continue-on-error, чтобы не ронять Windows/Linux-релиз.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    continue-on-error: ${{ matrix.platform == 'macos-latest' }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-release

      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - run: npm ci

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # releaseDraft/prerelease выключены: /releases/latest не включает
          # такие релизы, а на него смотрит endpoint авто-обновления
          # (tauri.conf.json → plugins.updater)
          releaseName: Nocturn ${{ github.ref_name }}
          releaseBody: "Скачай установщик для своей платформы. Обновление из приложения — автоматически (Windows: NSIS/MSI, Linux: AppImage; .deb обновляется вручную). macOS-сборки не автоподписаны — обновление из приложения на macOS не работает."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
