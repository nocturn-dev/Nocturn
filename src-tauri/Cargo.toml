[package]
name = "nocturn"
version = "0.2.2"
description = "Nocturn — универсальный ИИ-клиент (BYOK)"
authors = ["Nocturn"]
edition = "2021"
# Реальный MSRV кода (as_chunks) — 1.88; это также гарантирует фикс
# BatBadBut (CVE-2024-24576): безопасный .arg() для cmd /C только с 1.77.2
rust-version = "1.88"
# Два бинаря: само приложение (nocturn.exe) и mcp_echo_helper (для e2e-тестов).
# Без default-run `cargo run`/`tauri dev` не знает, какой запускать.
default-run = "nocturn"

[[bin]]
name = "nocturn"
path = "src/main.rs"

[lib]
name = "nocturn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Импорт provider-конфигов Codex-стиля (config.toml, [model_providers.*])
toml = "0.9"
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "deflate", "query", "form"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["time", "macros"] }
tauri-plugin-dialog = "2.7.3"
portable-pty = "0.9.0"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
xcap = "0.4"
enigo = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
aes-gcm = { version = "0.10", features = ["zeroize"] }
rand = "0.8"
pbkdf2 = "0.12"
argon2 = "0.5"
zeroize = "1.8"
sha2 = "0.10"
tauri-plugin-notification = "2.4.0"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Открытие внешних ссылок в системном браузере: target="_blank" в wry — deny
# на всех платформах без обработчика new-window, а навигация самого вебвью —
# фишинг в доверенном окне. Потребитель — MarkdownLink (фронт)
tauri-plugin-opener = "2"
url = "2"
# Хирургия GGUF (gguf.rs, шаг 3a): источник читается mmap-ом — последовательные
# диапазоны тензоров из 40-ГБ файла без лишней копии в page cache (ресёрч §3.3)
memmap2 = "0.9"
# Запись в системный буфер из Rust (см. clipboard.rs): navigator.clipboard
# из JS — перехватываемая поверхность (клиппер-малварь)
arboard = "3"

[target.'cfg(unix)'.dependencies]
# kill(-pgid) для kill_tree: std не умеет сигналить процесс-группе
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Проигрывание SAPI-WAV в выбранное устройство вывода (TTS): SAPI сам
# умеет только дефолтное устройство. rodio = cpal + декодер; wav —
# единственный нужный формат (наш собственный рендер)
rodio = { version = "0.19", default-features = false, features = ["wav"] }
# Медиа-минибар: состояние и управление плеером через системные SMTC
# (System Media Transport Controls) — без аккаунтов и облака Spotify
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Портал GlobalShortcuts — единственный легальный путь глобальных хоткеев на
# Wayland (XGrabKey там недоступен в принципе). ashpd unix-only (file_path
# тянет os::unix::ffi) — потому linux-гейт, а компиляцию проверяет ubuntu-джоба
# CI (cargo test линкует). В рантайме активируется только в Wayland-сессии
# и только когда плагин global-shortcut не смог
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
